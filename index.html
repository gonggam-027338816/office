<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공감탐정행정사사무소 | 행정심판·부동산계약·권리금·비자·국제결혼 전문</title>
  <style>
    :root {
      --primary-navy: #14213d;
      --secondary-navy: #1f325c;
      --accent-gold: #b08d57;
      --light-gold: #f5efe6;
      --bg-gray: #f4f5f7;
      --text-dark: #222222;
      --text-muted: #555555;
      --white: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      background-color: var(--bg-gray);
      color: var(--text-dark);
      line-height: 1.6;
    }
    a { text-decoration: none; color: inherit; }

    /* 상단 네비게이션 */
    header {
      background-color: var(--primary-navy);
      color: var(--white);
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .nav-container {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 14px;
      font-weight: bold;
    }
    .nav-links a {
      padding: 6px 11px;
      border-radius: 5px;
      transition: background 0.2s;
    }
    .nav-links a:hover {
      background-color: var(--accent-gold);
      color: var(--white);
    }
    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-call {
      background-color: var(--accent-gold);
      color: var(--white);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }
    .btn-mail-top {
      background-color: transparent;
      border: 1px solid var(--accent-gold);
      color: #f3dfb9;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    /* 히어로 배너 */
    .hero {
      background: linear-gradient(135deg, var(--primary-navy) 0%, var(--secondary-navy) 100%);
      color: var(--white);
      text-align: center;
      padding: 50px 20px;
      border-bottom: 4px solid var(--accent-gold);
    }
    .symbol-g {
      width: 58px;
      height: 58px;
      margin: 0 auto 14px;
      border: 2px solid var(--accent-gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
      color: var(--accent-gold);
      font-family: Georgia, serif;
    }
    .hero h1 { font-size: 28px; margin-bottom: 10px; letter-spacing: 1px; }
    .hero p { font-size: 16px; color: #e0e4ec; max-width: 760px; margin: 0 auto 18px; }
    .hero-notice {
      display: inline-block;
      background: rgba(176, 141, 87, 0.22);
      border: 1px solid var(--accent-gold);
      color: #f3dfb9;
      padding: 7px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
    }

    /* 메인 컨테이너 */
    .container {
      max-width: 1120px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .section-title {
      font-size: 22px;
      color: var(--primary-navy);
      border-left: 5px solid var(--accent-gold);
      padding-left: 12px;
      margin: 45px 0 14px;
    }
    .section-desc {
      color: var(--text-muted);
      font-size: 14px;
      margin: 0 0 20px 17px;
    }

    /* 일반 3단 카드 */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 18px;
    }
    .card {
      background: var(--white);
      border-radius: 10px;
      padding: 22px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.06);
      border-top: 3px solid var(--primary-navy);
    }
    .card h3 {
      font-size: 17px;
      color: var(--primary-navy);
      margin-bottom: 10px;
    }
    .card p {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* 비자·출입국 특별 안내 배너 */
    .visa-alert-box {
      background: linear-gradient(to right, #fdfbf7, #f5efe6);
      border: 1px solid #d8c3a0;
      border-left: 5px solid var(--accent-gold);
      border-radius: 8px;
      padding: 18px 20px;
      margin-bottom: 22px;
    }
    .visa-alert-box p {
      font-size: 14.5px;
      color: var(--primary-navy);
      margin-bottom: 6px;
      font-weight: bold;
    }
    .visa-alert-box p:last-child { margin-bottom: 0; }

    /* 비자 클릭 펼침 카드 (아코디언) */
    .visa-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 14px;
    }
    details.visa-item {
      background: var(--white);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 1px solid #e2e8f0;
      border-top: 3px solid var(--primary-navy);
      overflow: hidden;
      transition: all 0.2s ease;
    }
    details.visa-item[open] {
      border-top-color: var(--accent-gold);
      background-color: #fffdf9;
    }
    details.visa-item summary {
      padding: 16px 18px;
      font-size: 16px;
      font-weight: bold;
      color: var(--primary-navy);
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    details.visa-item summary::-webkit-details-marker { display: none; }
    details.visa-item summary::after {
      content: "▼ 상세보기";
      font-size: 12px;
      color: var(--accent-gold);
      background: var(--light-gold);
      padding: 3px 8px;
      border-radius: 12px;
    }
    details.visa-item[open] summary::after {
      content: "▲ 닫기";
      background: var(--primary-navy);
      color: var(--white);
    }
    .visa-detail-body {
      padding: 0 18px 18px;
      font-size: 14px;
      color: var(--text-dark);
      border-top: 1px dashed #e5e7eb;
      padding-top: 12px;
    }
    .visa-detail-body ul {
      padding-left: 18px;
      margin-top: 6px;
      color: var(--text-muted);
    }
    .visa-detail-body li { margin-bottom: 4px; }

    /* 협업 광고 박스 */
    .collab-box {
      background-color: var(--light-gold);
      border: 1px solid #dfd1ba;
      border-radius: 10px;
      padding: 25px;
      margin-top: 30px;
    }
    .collab-box h3 {
      color: var(--primary-navy);
      margin-bottom: 14px;
      font-size: 18px;
    }
    .collab-list {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 12px;
    }
    .collab-list li {
      background: var(--white);
      padding: 15px 16px;
      border-radius: 6px;
      font-size: 14px;
      border-left: 4px solid var(--accent-gold);
    }

    /* 상담 및 전화 연결 창 */
    .consult-section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }
    .consult-box {
      background: var(--white);
      border-radius: 10px;
      padding: 25px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.06);
      border-top: 4px solid var(--accent-gold);
    }
    .consult-box h3 {
      color: var(--primary-navy);
      margin-bottom: 14px;
      font-size: 18px;
    }
    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 5px;
      color: var(--primary-navy);
    }
    .form-group select,
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }
    .submit-btn {
      width: 100%;
      background-color: var(--primary-navy);
      color: var(--white);
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .submit-btn:hover { background-color: var(--accent-gold); }
    .direct-call-card {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }
    .call-link-box {
      display: block;
      background-color: var(--bg-gray);
      border: 1px solid #d1d5db;
      padding: 13px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      color: var(--primary-navy);
      font-size: 15px;
    }
    .call-link-box span {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: normal;
      margin-top: 3px;
    }

    /* 푸터 및 다국어 주소 */
    footer {
      background-color: var(--primary-navy);
      color: #e5e7eb;
      padding: 40px 20px;
      margin-top: 50px;
      font-size: 13.5px;
    }
    .footer-inner {
      max-width: 1120px;
      margin: 0 auto;
    }
    .footer-title {
      color: var(--accent-gold);
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .footer-info p { margin-bottom: 6px; }
    .address-block {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.2);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 8px;
    }
    .address-block p {
      background: rgba(255,255,255,0.06);
      padding: 8px 12px;
      border-radius: 5px;
      font-size: 13px;
    }
    .copyright {
      margin-top: 22px;
      color: #9ca3af;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
